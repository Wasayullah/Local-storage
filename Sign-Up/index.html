<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<title>Signup Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6a11cb,#2575fc);
}

footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    text-align:center;
    color:white;
    padding:15px 0;
}

.container{
    width:350px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    padding:35px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
    text-align:center;
    color:white;
}

.container h2{
    margin-bottom:25px;
    font-size:30px;
}

.input-box{
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:15px;
}

.input-box input::placeholder{
    color:#eee;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:white;
    color:#2575fc;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
    background:#f1f1f1;
}

.login-link{
    margin-top:15px;
    font-size:14px;
}

.login-link a{
    color:#fff;
    font-weight:bold;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="container">
    <h2>Create Account</h2>

    <div>
        <div class="input-box">
            <input type="email"id="semail" placeholder="Enter your Email" required>
        </div>

        <div class="input-box">
            <input type="password" id="spass" placeholder="Enter your Password" required>
        </div>

        <button onclick="signup()"  class="btn">Sign Up</button>
    </div>

    <div class="login-link">
        Already have an account? <a href="signin.html">Login</a>
    </div>
</div>
<footer>
                <p class="text-secondary fs-6 mt-4">
                <i class="fas fa-code"></i> Developer Mohammad wasayullah <br />
                &copy; All rights reserved 2026
            </p>

</footer>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
</body>
</html>
