<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Successful</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container{
            width:400px;
            background:#fff;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        .tick{
            width:90px;
            height:90px;
            margin:auto;
            border-radius:50%;
            background:#28a745;
            color:white;
            font-size:50px;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        h1{
            margin:25px 0 10px;
            color:#333;
        }

        p{
            color:#666;
            margin-bottom:30px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#007bff;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#0056b3;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="tick">✓</div>

        <h1>Login Successful!</h1>

        <p>Welcome back. You have successfully logged into your account.</p>

        <button onclick="goHome()">Continue</button>

    </div>

    <script>
        function goHome(){
            window.location.href = "index.html";
        }
const user = JSON.parse(localStorage.getItem("loggedInUser"));

if (user) {
    document.querySelector("h1").innerHTML = `Welcome, ${user.name}!`;
}
    </script>

</body>
</html>
